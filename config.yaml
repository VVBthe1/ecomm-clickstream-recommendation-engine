dataset:
  kaggle_slug: mkechinov/ecommerce-behavior-data-from-multi-category-store
  bronze_file: 2019-Oct.csv
  chunk_size: 500000
  max_chunks: null
paths:
  bronze_dir: data/bronze
  silver_dir: data/silver/events
  gold_dir: data/gold
  metadata_dir: metadata
  figures_dir: metadata/figures
processing:
  valid_event_types:
  - view
  - cart
  - remove_from_cart
  - purchase
  rolling_window_days: 7
training:
  gold_file: product_by_day.parquet
  target: purchases_next_day
  feature_columns:
  - views
  - carts
  - removals
  - purchases
  - views_7d
  - carts_7d
  - purchases_7d
  train_days: 23
  test_days: 7
  models_dir: data/models
  results_file: metadata/model_results.json
  shap:
    enabled: true
    sample_rows: 5000
    model: xgboost
